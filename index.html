<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DXF Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="toolbar-title">DXF Viewer</div>
        <div class="toolbar-controls">
          <input id="fileInput" type="file" accept=".dxf,.jww" />
          <button id="fitButton" type="button" disabled>全体表示</button>
          <button id="zoomOutButton" type="button" disabled>縮小 -</button>
          <button id="zoomInButton" type="button" disabled>拡大 +</button>
        </div>
        <p id="edgeInfo" class="edge-info">エッジ選択: エッジをクリックしてください。文字をクリックするとコピーできます。</p>
        <p id="measureInfo" class="measure-info">距離測定: 2頂点をクリックしてください。</p>
      </header>
      <section class="viewer-area">
        <canvas id="viewer"></canvas>
        <aside class="layer-window" aria-label="レイヤー表示設定">
          <h2 class="layer-window-title">レイヤー</h2>
          <div id="layerControls" class="layer-controls"></div>
        </aside>
      </section>
      <footer class="status-footer" aria-label="ステータス">
        <div class="measurement-scale" aria-label="計測スケール">
          <label for="measurementScaleNumerator">スケール</label>
          <input id="measurementScaleNumerator" type="number" min="0.000001" step="any" value="1" inputmode="decimal" aria-label="スケールの分子" />
          <span aria-hidden="true">/</span>
          <input id="measurementScaleDenominator" type="number" min="0.000001" step="any" value="1" inputmode="decimal" aria-label="スケールの分母" />
        </div>
        <p id="status" class="status">ファイルを選択してください。</p>
        <progress id="loadProgress" class="load-progress" aria-label="ファイル読み込みの進捗" hidden></progress>
      </footer>
    </main>

    <script type="module" src="/app.ts"></script>
  </body>
</html>
